[project]
name = "devforge-doom-template"
version = "0.1.0"
description = "Starter template for DevForge 'Can It Play DOOM?' (Yugaantar 2026)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "doom-env",
    "vizdoom==1.3.3",
    "gymnasium>=1.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]
# Training only (never imported by submission/; the scorer's image already ships torch 2.15.0).
# psutil: Windows ViZDoom latency fix in training/win_ipc.py.
# scipy: BFS for the training-time expert (training/expert.py); same version as the official image.
train = ["torch==2.15.0", "psutil>=6", "imageio-ffmpeg>=0.5", "scipy==1.18.1"]   # imageio-ffmpeg: bundled ffmpeg for training/record.py

[tool.uv]
default-groups = ["dev", "train"]

[tool.uv.sources]
doom-env = { path = "env", editable = true }
# CUDA 13.2 wheels: the only index with torch 2.15.0 (the scorer's version) for Windows.
# They cover Ampere (RTX 3050, sm_86) and Blackwell (RTX 5060, sm_120); need a recent NVIDIA driver.
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
