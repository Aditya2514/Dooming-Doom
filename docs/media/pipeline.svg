<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Training pipeline: privileged teacher, DAgger, sensor-only student">
<title>Training pipeline: privileged teacher, DAgger, sensor-only student</title>
<style>
  .sans { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, Menlo, monospace; }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  .flow { stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>
<rect width="1280" height="560" rx="18" fill="#0d1117" stroke="#30363d"/><rect x="24" y="22" width="828" height="34" rx="8" fill="#ff4d2e" fill-opacity=".07"/><text x="40" y="44" class="mono" font-size="12" font-weight="600" fill="#ff8a3d" text-anchor="start" letter-spacing="1.3">TRAINING ONLY · ground truth allowed</text><rect x="872" y="22" width="384" height="34" rx="8" fill="#338ced" fill-opacity=".08"/><text x="888" y="44" class="mono" font-size="12" font-weight="600" fill="#338ced" text-anchor="start" letter-spacing="1.3">EVALUATION · official sensors only</text><line x1="862" y1="22" x2="862" y2="400" stroke="#30363d" stroke-dasharray="4 6"/><rect x="24" y="76" width="340" height="300" rx="14" fill="#11151c" stroke="#30363d" /><text x="46" y="114" class="mono" font-size="13" font-weight="700" fill="#ff8a3d" text-anchor="start" >01</text><text x="76" y="114" class="sans" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start" >Privileged teacher</text><text x="46" y="138" class="mono" font-size="12" font-weight="400" fill="#6e7681" text-anchor="start" >training/expert.py</text><circle cx="49" cy="173" r="2.5" fill="#ff8a3d"/><text x="60" y="178" class="sans" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start" >sees the floor plan + its true pose</text><circle cx="49" cy="199" r="2.5" fill="#ff8a3d"/><text x="60" y="204" class="sans" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start" >BFS planner on a 16-unit grid</text><circle cx="49" cy="225" r="2.5" fill="#ff8a3d"/><text x="60" y="230" class="sans" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start" >but decisions stay imitable:</text><circle cx="49" cy="251" r="2.5" fill="#ff8a3d"/><text x="60" y="256" class="sans" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start" >  explores where its rays haven't swept</text><circle cx="49" cy="277" r="2.5" fill="#ff8a3d"/><text x="60" y="282" class="sans" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start" >  keys once seen, exit once on camera</text><circle cx="49" cy="303" r="2.5" fill="#ff8a3d"/><text x="60" y="308" class="sans" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start" >  fights &amp; dodges what is visible</text><rect x="46" y="328" width="296" height="30" rx="8" fill="#161b22"/><text x="194.0" y="348" class="mono" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle" >100% exits on validation maps</text><rect x="404" y="76" width="432" height="300" rx="14" fill="#11151c" stroke="#30363d" /><text x="426" y="114" class="mono" font-size="13" font-weight="700" fill="#ff8a3d" text-anchor="start" >02</text><text x="456" y="114" class="sans" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start" >DAgger: learn while playing</text><text x="426" y="138" class="mono" font-size="12" font-weight="400" fill="#6e7681" text-anchor="start" >training/dagger.py</text><circle cx="620.0" cy="252" r="74" fill="none" stroke="#30363d" stroke-width="2"/><circle cx="620.0" cy="252" r="74" fill="none" stroke="#ff8a3d" stroke-width="2" class="flow" opacity=".8"/><circle r="5" fill="#ff8a3d"><animateMotion dur="6s" repeatCount="indefinite" begin="0s" path="M620.0,178 a74,74 0 1,1 0,148 a74,74 0 1,1 0,-148"/></circle><circle r="5" fill="#ff8a3d"><animateMotion dur="6s" repeatCount="indefinite" begin="-2s" path="M620.0,178 a74,74 0 1,1 0,148 a74,74 0 1,1 0,-148"/></circle><circle r="5" fill="#ff8a3d"><animateMotion dur="6s" repeatCount="indefinite" begin="-4s" path="M620.0,178 a74,74 0 1,1 0,148 a74,74 0 1,1 0,-148"/></circle><circle cx="620.0" cy="178" r="7" fill="#0d1117" stroke="#ff8a3d" stroke-width="2"/><text x="620.0" y="164" class="sans" font-size="13" font-weight="500" fill="#9da7b3" text-anchor="middle" >student drives</text><circle cx="694.0" cy="252" r="7" fill="#0d1117" stroke="#ff8a3d" stroke-width="2"/><text x="708.0" y="250" class="sans" font-size="13" font-weight="500" fill="#9da7b3" text-anchor="start" >teacher labels</text><text x="708.0" y="267" class="sans" font-size="13" font-weight="500" fill="#9da7b3" text-anchor="start" >every state</text><circle cx="620.0" cy="326" r="7" fill="#0d1117" stroke="#ff8a3d" stroke-width="2"/><text x="620.0" y="352" class="sans" font-size="13" font-weight="500" fill="#9da7b3" text-anchor="middle" >1.5M-state dataset</text><circle cx="546.0" cy="252" r="7" fill="#0d1117" stroke="#ff8a3d" stroke-width="2"/><text x="532.0" y="250" class="sans" font-size="13" font-weight="500" fill="#9da7b3" text-anchor="end" >train GRU on</text><text x="532.0" y="267" class="sans" font-size="13" font-weight="500" fill="#9da7b3" text-anchor="end" >whole episodes</text><text x="620.0" y="248" class="mono" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle" >β: 0.5 → 0.1</text><text x="620.0" y="360" class="mono" font-size="12" font-weight="500" fill="#6e7681" text-anchor="middle" >+ RGB exit detector pre-trained on teacher frames</text><text x="620.0" y="267" class="mono" font-size="11" font-weight="400" fill="#6e7681" text-anchor="middle" >teacher share</text><rect x="884" y="76" width="372" height="300" rx="14" fill="#11151c" stroke="#338ced" stroke-opacity=".6"/><text x="906" y="114" class="mono" font-size="13" font-weight="700" fill="#338ced" text-anchor="start" >03</text><text x="936" y="114" class="sans" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start" >Sensor-only student</text><text x="906" y="138" class="mono" font-size="12" font-weight="400" fill="#6e7681" text-anchor="start" >submission/agent.py · ships</text><circle cx="909" cy="173" r="2.5" fill="#338ced"/><text x="920" y="178" class="sans" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start" >64 rays · ≤32 visible entities · vitals</text><circle cx="909" cy="199" r="2.5" fill="#338ced"/><text x="920" y="204" class="sans" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start" >+ its own dead-reckoned spatial map</text><circle cx="909" cy="225" r="2.5" fill="#338ced"/><text x="920" y="230" class="sans" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start" >+ RGB exit detector (30×40 frame)</text><circle cx="909" cy="251" r="2.5" fill="#338ced"/><text x="920" y="256" class="sans" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start" >GRU 256 → 16 macro-actions · 993k params</text><circle cx="909" cy="277" r="2.5" fill="#338ced"/><text x="920" y="282" class="sans" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start" >~4.7 ms per decision on 1 CPU thread</text><circle cx="909" cy="303" r="2.5" fill="#338ced"/><text x="920" y="308" class="sans" font-size="14" font-weight="400" fill="#9da7b3" text-anchor="start" >no coordinates, no ground truth</text><rect x="906" y="328" width="328" height="30" rx="8" fill="#338ced" fill-opacity=".14"/><text x="1070.0" y="348" class="mono" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle" >every action comes from the network</text><line x1="364" y1="226" x2="396" y2="226" stroke="#ff8a3d" stroke-width="2.2" class="flow"/><path d="M394,220 L404,226 L394,232 Z" fill="#ff8a3d"/><text x="384.0" y="216" class="mono" font-size="11" font-weight="500" fill="#6e7681" text-anchor="middle" >labels</text><line x1="836" y1="226" x2="876" y2="226" stroke="#338ced" stroke-width="2.2" class="flow"/><path d="M874,220 L884,226 L874,232 Z" fill="#338ced"/><text x="860.0" y="216" class="mono" font-size="11" font-weight="500" fill="#6e7681" text-anchor="middle" >weights</text><path d="M1070.0,376 V460 H856" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-dasharray="3 5"/><rect x="404" y="416" width="452" height="120" rx="14" fill="#11151c" stroke="#30363d" stroke-dasharray="5 5"/><text x="426" y="450" class="mono" font-size="13" font-weight="700" fill="#6e7681" text-anchor="start" >04</text><text x="456" y="450" class="sans" font-size="18" font-weight="700" fill="#9da7b3" text-anchor="start" >Recurrent PPO fine-tuning</text><text x="426" y="478" class="sans" font-size="13" font-weight="400" fill="#6e7681" text-anchor="start" >scorer-aligned rewards + count-based curiosity on its own map</text><text x="426" y="508" class="mono" font-size="13" font-weight="500" fill="#9da7b3" text-anchor="start" >built and measured: held-out exits 0.58 → 0.38</text><rect x="734" y="430" width="100" height="24" rx="12" fill="none" stroke="#6e7681"/><text x="784" y="447" class="mono" font-size="11" font-weight="700" fill="#6e7681" text-anchor="middle" letter-spacing="1">NOT SHIPPED</text><text x="24" y="456" class="sans" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start" >Why not RL from scratch?</text><text x="24" y="482" class="sans" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start" >It spends most of its budget learning</text><text x="24" y="502" class="sans" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start" >that walking forward is useful. Imitation</text><text x="24" y="522" class="sans" font-size="13" font-weight="400" fill="#9da7b3" text-anchor="start" >starts from competent play instead.</text>
</svg>
